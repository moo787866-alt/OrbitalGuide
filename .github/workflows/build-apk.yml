name: Build Orbital Guide APK

on:
  workflow_dispatch:
  push:
    paths:
      - "OrbitalGuide-AndroidStudio-Source.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found"
            exit 1
          fi
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses </dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract source code
        run: unzip -o OrbitalGuide-AndroidStudio-Source.zip -d source

      - name: Build debug APK
        working-directory: source/OrbitalGuide
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbitalGuide-debug-APK
          path: source/OrbitalGuide/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
